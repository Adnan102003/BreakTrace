name: BreakTrace checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run smoke -- .data/ci
      - name: Validate report quality gates
        run: |
          npm run gate -- .data/ci/repaired.json
          set +e
          npm run gate -- .data/ci/original.json
          code=$?
          set -e
          test "$code" -eq 1
