services:
  breaktrace:
    environment:
      BREAKTRACE_MONGO_URI: ${BREAKTRACE_MONGO_URI:?Provide a MongoDB URI for the private Compose database}
      BREAKTRACE_MONGO_DB: ${BREAKTRACE_MONGO_DB:-breaktrace}
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${BREAKTRACE_MONGO_USER:?Provide a MongoDB username}
      MONGO_INITDB_ROOT_PASSWORD: ${BREAKTRACE_MONGO_PASSWORD:?Provide a MongoDB password}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"',
        ]
      interval: 5s
      timeout: 8s
      retries: 12
volumes:
  mongo_data:
